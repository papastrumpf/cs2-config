// Show settings and defaults
sys_info

// Launch Parameters
// These settings optimize game performance and appearance.
// Add: -novid -nojoy -fullscreen +fps_max 0 +engine_low_latency_sleep_after_client_tick true +exec autoexec.cfg

// Console Activation
// Allows the console to be activated.
con_enable "1"

// Developer Message Level
// Sets the developer message level for debugging.
developer "0"

// Radar HUD Scaling
// Adjusts the size of the radar HUD element.
cl_hud_radar_scale "1.2"

// Radar Scale
// Adjusts the scale of the radar map display.
cl_radar_scale "0.4"

// Radar Icon Scale
// Sets the minimum scale of icons on the radar.
cl_radar_icon_scale_min "0.8"

// Radar Centering
// Centers the radar around the player or uses best fit.
cl_radar_always_centered "0"

// Radar Rotation
// Rotates the radar based on player orientation.
cl_radar_rotate "1"

// Client Timeout
// Time in seconds before disconnecting due to no server packets.
cl_timeout "30"

// AFK Movement Script
// Automatically moves the player to prevent AFK kicks.

alias toggle-forward "toggle-forward_on"
alias toggle-forward_on "+forward; alias toggle-forward toggle-forward_off"
alias toggle-forward_off "-forward; alias toggle-forward toggle-forward_on"

alias toggle-turnleft "toggle-turnleft_on"
alias toggle-turnleft_on "+turnleft; alias toggle-turnleft toggle-turnleft_off"
alias toggle-turnleft_off "-turnleft; alias toggle-turnleft toggle-turnleft_on"

alias afk-move "cycle-forward"
alias cycle-forward "toggle-forward; alias afk-move cycle-turnleft"
alias cycle-turnleft "toggle-turnleft; alias afk-move cycle-forward"

bind "k" "afk-move"

// Enemy Team Mute Toggle
// Toggles muting of the enemy team's voice communications.
alias mute-enemy-team "mute-enemy-team_on"
alias mute-enemy-team_on "cl_mute_enemy_team 1; alias mute-enemy-team mute-enemy-team_off"
alias mute-enemy-team_off "cl_mute_enemy_team 0; alias mute-enemy-team mute-enemy-team_on"
bind "j" "mute-enemy-team"

// Bomb Drop Script
// Hold MOUSE3: knife/C4 out. Release: drop C4, back to previous weapon, "Bomb dropped" radio line.
alias "+bomb-drop" "slot3; slot5"
alias "-bomb-drop" "drop; lastinv; playerchatwheel CW.droppedbomb #Chatwheel_droppedbomb"
bind "MOUSE3" "+bomb-drop"

// Quick Weapon Switch
// Binds quick weapon switch to the Q key.
alias +switchw "slot3"
alias -switchw "lastinv"
bind "Q" +switchw

// Network Stats on TAB
// Hold TAB: scoreboard plus always-on ping, packet loss, frame time and network quality graph.
alias +netg "+showscores; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_net_quality_graph_show 2"
alias -netg "-showscores; cl_hud_telemetry_ping_show 1; cl_hud_telemetry_net_misdelivery_show 1; cl_hud_telemetry_frametime_show 1; cl_hud_telemetry_net_quality_graph_show 0"
bind TAB "+netg"

// Mouse Sensitivity
// Sets mouse sensitivity at 1600 DPI.
sensitivity 0.24
m_yaw "0.022"
m_pitch "0.022"

// Clutch Walk
// Hold SHIFT: walk, louder game volume, quieter teammate voices and brighter screen.
// Release restores exact normal values.
// Edit these to your taste (gamma: lower = brighter, only in exclusive fullscreen).
alias vol-normal     "volume 0.5"
alias vol-clutch     "volume 1.0"
alias voice-normal   "snd_voipvolume 2"
alias voice-quiet    "snd_voipvolume 0.5"
alias gamma-normal   "r_fullscreen_gamma 1.829449"
alias gamma-bright   "r_fullscreen_gamma 1.6"
alias +incvol "vol-clutch; voice-quiet; gamma-bright; +sprint"
alias -incvol "vol-normal; voice-normal; gamma-normal; -sprint"
bind SHIFT +incvol
vol-normal

// Clutch Crouch
// Hold CTRL: crouch with the same louder volume, quieter voices and brighter screen as SHIFT.
alias +clutchduck "vol-clutch; voice-quiet; gamma-bright; +duck"
alias -clutchduck "vol-normal; voice-normal; gamma-normal; -duck"

// Toggle Voice Enable/Disable
// Toggles voice enable/disable on key press.
bind "T" "toggle voice_modenable 1 0"


// Multi-Action Buy/Equip Toggle (Hold/Release Caps Lock to Switch)

// Default behavior
alias defX        "bind x slot6" // HE grenade
alias defF        "bind f slot7" // Flash   
alias defZ        "bind z slot8" // Smoke    
alias defV        "bind v slot10" // Molotov   

alias def1        "bind 1 slot1"
alias def2        "bind 2 slot2"
alias def3        "bind 3 knife-inspect"
alias def4        "bind 4 slot4"
alias def5        "bind 5 slot5"

// Keybind switch
alias keyX        "bind x customX"
alias keyF        "bind f customF"    
alias keyZ        "bind z customZ"     
alias keyV        "bind v customV"

alias key1        "bind 1 customBuy1"
alias key2        "bind 2 customBuy2"
alias key3        "bind 3 customBuy3"
alias key4        "bind 4 customBuy4"
alias key5        "bind 5 customBuy5"

// Buy commands (Loadouts and Grenades)
alias customX     "buy hegrenade"
alias customF     "buy flashbang"
alias customZ     "buy smokegrenade"
alias customV     "buy molotov; buy incgrenade"

alias customBuy1  "buy ak47; buy m4a1_silencer; buy flashbang; buy molotov; buy incgrenade; buy hegrenade; buy smokegrenade"
alias customBuy2  "buy ak47; buy m4a1_silencer; buy flashbang; buy flashbang; buy molotov; buy incgrenade; buy smokegrenade"
alias customBuy3  "buy vest"
alias customBuy4  "buy vesthelm"
alias customBuy5  "buy defuser"

// Buy Scripts
// Quick buy scripts for various game situations.
bind "M" "buy vest; buy deagle;"
bind "," "buy vesthelm; buy defuser; buy incgrenade; buy flashbang; buy smokegrenade; buy hegrenade; buy m4a1_silencer; buy fiveseven;"
bind "." "buy vesthelm; buy molotov; buy flashbang; buy hegrenade; buy smokegrenade; buy ak47; buy deagle;"
bind "/" "buy vesthelm; buy smokegrenade; buy hegrenade; buy flashbang; buy incgrenade; buy molotov; buy awp; buy deagle;"

// Toggle logic
alias +secondaryaction "keyZ; keyV; keyX; keyF; key1; key2; key3; key4; key5"
alias -secondaryaction "defZ; defV; defX; defF; def1; def2; def3; def4; def5"
bind CAPSLOCK +secondaryaction

// Apply default equip binds on load (otherwise they only exist after the first CAPSLOCK release)
-secondaryaction

// Switch Hands Bind
// Binds hand switch action to the C key.
bind "C" switchhands

// Space Jump
// CS2 gives a consistent jumpthrow when you throw on the way up, no script needed.
bind space +jump

// Pull knife, press again to inspect
alias knife-inspect "slot3; +lookatweapon; -lookatweapon"
bind "3" "knife-inspect"

// Infinite Inspect Bind
bind "i" "toggle_inspect"
alias "toggle_inspect" "inspect_on"
alias "inspect_on" "+lookatweapon; alias toggle_inspect inspect_off"
alias "inspect_off" "-lookatweapon; alias toggle_inspect inspect_on"

// View Model Settings
// Adjusts view model for optimal gameplay view.
viewmodel_fov 68
viewmodel_offset_x -2;
viewmodel_offset_y -2;
viewmodel_offset_z -2;
viewmodel_presetpos 0

// Toggle Cross Follow Recoil
bind N "toggle cl_crosshair_recoil false true"

// Crosshair Settings
// Configures crosshair appearance and style.
cl_crosshair_drawoutline "1"
cl_crosshairoutline_r "0"
cl_crosshairoutline_g "0"
cl_crosshairoutline_b "0"
cl_crosshairoutline_a "255"
cl_crosshair_dynamic_maxdist_splitratio "0.08"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.3"
cl_crosshair_dynamic_spread_limit "191"
cl_crosshair_dynamic_splitdist "5"
cl_crosshair_t "0"
cl_crosshaircolor_a "255"
cl_crosshaircolor_b "255"
cl_crosshaircolor_g "0"
cl_crosshaircolor_r "255"
cl_crosshairdot "0"
cl_crosshair_gap "4"
cl_crosshair_length "8"
cl_crosshairstyle "9" // static quad
cl_crosshair_thickness "4"
cl_crosshair_recoil "0"
cl_crosshair_sniper_width "1"
cl_crosshair_friendly_warning "0"
cl_ironsight_dot_scale "1"
cl_ironsight_usecrosshaircolor "0"

// Network Settings
// Sets maximum ping limit for matchmaking.
mm_dedicated_search_maxping 40

// Sound Settings
// Fine-tunes various sound parameters.
snd_spatialize_lerp "0.5"
snd_steamaudio_enable_perspective_correction "true"
snd_headphone_eq "1" // 0: natural, 1: crisp, 2: smooth
voice_always_sample_mic "true"
voice_threshold "-55"
snd_mute_losefocus "false"
snd_mute_mvp_music_live_players "true"
snd_deathcamera_volume "0"
snd_mapobjective_volume "0" // bomb/hostage music off
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_tensecondwarning_volume "0.01" // 10% on the slider (slider % = sqrt of value), 10s bomb warning for defuse/save
snd_mvp_volume "0.01" // 10% on the slider, still muted while players are alive
cl_player_ping_mute "1"
voice-normal // teammate voice volume, set in Clutch Walk
snd_gamevoicevolume "0.6" // quieter agent/announcer radio lines

// Custom Control Behavior
// Hold ALT: big radar and teammate names overhead.
alias "+custom_alt" "cl_radar_scale 1.0; cl_teamid_overhead_mode 2"
alias "-custom_alt" "cl_radar_scale 0.4; cl_teamid_overhead_mode 1"
bind "ALT" "+custom_alt"

// Follow Recoil on Right Click
// Hold MOUSE2: normal right click plus follow-recoil crosshair, release turns it off.
// Idea: hold right + left click together when spraying, so the crosshair
// follows the spray. Just left click for taps keeps the static crosshair.
// Don't use it with pistols: you tap them, so there's no spray to follow, and right click
// changes the pistol (Glock burst, R8 alt fire).
// Silencers never come off: right click can't detach them on M4A1-S / USP-S.
cl_silencer_mode "0"
alias "+recoil-attack2" "+attack2; cl_crosshair_recoil 1"
alias "-recoil-attack2" "-attack2; cl_crosshair_recoil 0"
bind "MOUSE2" "+recoil-attack2"

// Engine Settings
engine_no_focus_sleep "30"
speaker_config 2
r_show_build_info 0
fps_max 0
gamma-normal // set in Clutch Walk
cl_autohelp 0
demo_flush 0
cl_hide_avatar_images 1
cl_allow_animated_avatars "false"
cl_teamcounter_playercount_instead_of_avatars "true"
cl_hud_color 7 // orange
hud_scaling "0.9" // smallest allowed
cl_color 4 // orange
cl_show_equipped_character_for_player_avatars 0

// Visibility & HUD
// Boost player contrast, cleaner HUD, no buy menu on E (E is defuse zoom).
r_player_visibility_mode "1"
cl_use_opens_buy_menu "0"
cl_showloadout "0"

// Telemetry
// Show ping, packet loss and frame time only when poor (0 never, 1 when poor, 2 always).
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_net_misdelivery_show "1"
cl_hud_telemetry_net_misdelivery_poor "2" // flag packet loss above 2% (default 5)
cl_hud_telemetry_frametime_show "1"

// Quality of Life
// Keep calling after death, no weapon auto-swap, teammate colors, fewer popups and clutter.
cl_disable_deathcam_audio_mix_fade_out "1" // game audio stays on during death cam
cl_teamid_overhead_colors_show "1" // overhead markers use teammate colors
cl_show_observer_crosshair "2" // show spectated player's crosshair
cl_invites_only_friends "1"
cl_invites_only_mainmenu "1" // no invite popups mid-match
cl_ping_fade_deadzone "20" // pings near crosshair stay visible (default 60)
cl_spec_show_bindings "0" // hide key hints while spectating

// Other Settings
rate "786432" // CS2 max, higher values get clamped
net_client_steamdatagram_enable_override "0"
cl_net_buffer_ticks "0" // 0 on stable wired connection, 1-2 only if jitter/loss

// Damage Prediction
// Only show hit/kill effects after the server confirms them.
cl_predict_body_shot_fx "0"
cl_predict_head_shot_fx "0"
cl_predict_kill_ragdolls "0"

// Server-side, only applies on servers you host (local/practice)
sv_clockcorrection_msecs "0"

// Fix Micro Stutters
engine_low_latency_sleep_after_client_tick true

// Defuse Zoom
// Hold E: use/defuse with a bigger radar, clutch volume and quieter voices to hear footsteps on the bomb.
alias "+defusezoom" "+use; cl_radar_scale 0.9; cl_autohelp 1; vol-clutch; voice-quiet"
alias "-defusezoom" "-use; cl_radar_scale 0.4; cl_autohelp 0; vol-normal; voice-normal"
bind e "+defusezoom"

// Use microphone on bind 4
bind "MOUSE5" "+voicerecord"

// Mic Test
// Press P to hear your own mic while talking (MOUSE5), press again to turn it off.
voice_loopback "0"
bind "p" "toggle voice_loopback 0 1"

// Player ping bind
bind "mouse4" "player_ping"

// Leetify all chat message
bind "l" "say Get Leetify"

cl_teamid_overhead_fade_near_crosshair 0.75

// Movement binds

alias "+myjump" "+jump"; alias "-myjump" "-jump";
bind "mwheeldown" "+myjump"
bind "mwheelup" "+myjump"

bind "ctrl" "+clutchduck"

exec movement/setup
exec guide/guide

snd_async_flush
host_writeconfig

play sounds/vo/hostage/huse/letsdoit